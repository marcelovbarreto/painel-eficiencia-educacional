<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tratamento, DEA, Malmquist e Tobit passo a passo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
:root{
  --fundo:#EEF0E9; --papel:#F8F9F4; --tinta:#1D2522; --tinta-suave:#56615B; --linha:#C9CFC4;
  --ponto:#A3ABA3; --avaliado:#B07D2A; --referencia:#2E6B57; --alvo:#3A2A1F; --realce:#F1E2BF;
  --serif:"STIX Two Text", "Cambria", "Georgia", serif;
  --sans:"Source Sans 3", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --fundo:#151B19; --papel:#1C2421; --tinta:#E4E7E0; --tinta-suave:#A3ADA6; --linha:#34403B;
    --ponto:#5E6A64; --avaliado:#DDAA55; --referencia:#73B89D; --alvo:#E8D5BA; --realce:#4A3B1E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --fundo:#151B19; --papel:#1C2421; --tinta:#E4E7E0; --tinta-suave:#A3ADA6; --linha:#34403B;
  --ponto:#5E6A64; --avaliado:#DDAA55; --referencia:#73B89D; --alvo:#E8D5BA; --realce:#4A3B1E;
  color-scheme: dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--fundo);color:var(--tinta);font-family:var(--sans);font-size:16px;line-height:1.5}
.pagina{max-width:1180px;margin:0 auto;padding:28px 20px 40px}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(1.6rem,3.2vw,2.3rem);line-height:1.15;margin:0 0 6px;letter-spacing:-.01em}
.lead{color:var(--tinta-suave);max-width:68ch;margin:0 0 22px}
.controles{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:end;margin-bottom:18px}
.campo{display:flex;flex-direction:column;gap:3px;font-size:.85rem;color:var(--tinta-suave)}
select,button,input[type=range]{font:inherit;color:var(--tinta)}
select{background:var(--papel);border:1px solid var(--linha);border-radius:6px;padding:6px 8px;min-width:9rem}
.botoes{display:flex;gap:6px;flex-wrap:wrap}
button{background:var(--papel);border:1px solid var(--linha);border-radius:6px;padding:7px 12px;cursor:pointer}
button.primario{background:var(--tinta);color:var(--fundo);border-color:var(--tinta)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--avaliado);outline-offset:2px}
.grade{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:880px){.grade{grid-template-columns:1fr}}
.plano{background:var(--papel);border:1px solid var(--linha);border-radius:10px;padding:8px 8px 4px}
.plano svg{display:block;width:100%;height:auto}
.eixo text{fill:var(--tinta-suave);font-family:var(--sans);font-size:12px}
.eixo path,.eixo line{stroke:var(--linha)}
.titulo-eixo{fill:var(--tinta-suave);font-size:12.5px;font-family:var(--sans)}
.rotulo{font-family:var(--sans);font-size:12px;fill:var(--tinta);paint-order:stroke;stroke:var(--papel);stroke-width:3px}
.painel{background:var(--papel);border:1px solid var(--linha);border-radius:10px;padding:18px 20px;min-height:420px}
.passos{list-style:none;padding:0;margin:0 0 14px;display:flex;gap:4px;flex-wrap:wrap}
.passos li button{font-size:.8rem;padding:4px 9px;border-radius:999px;color:var(--tinta-suave)}
.passos li button[aria-current="step"]{background:var(--avaliado);border-color:var(--avaliado);color:var(--papel)}
.painel h2{font-family:var(--serif);font-weight:600;font-size:1.3rem;margin:4px 0 4px}
.painel p{margin:6px 0;max-width:60ch}
.nota{font-size:.9rem;color:var(--tinta-suave)}
.municipio{font-family:var(--serif);font-size:1.05rem;color:var(--avaliado);font-weight:600}
.eq{font-family:var(--serif);font-size:1.12rem;line-height:1.9;margin:6px 0;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.eq .num{margin-left:auto;color:var(--tinta-suave);font-size:.95rem}
.eq i{font-style:italic}
.eq sub,.eq sup{font-size:.7em}
.v{display:inline-block;padding:0 4px;border-radius:4px;background:var(--realce);font-variant-numeric:tabular-nums;animation:entra .6s ease-out both;animation-delay:var(--d,0s)}
.r{display:inline-block;padding:0 5px;border-radius:4px;border:1.5px solid var(--avaliado);font-weight:600;font-variant-numeric:tabular-nums;animation:entra .6s ease-out both;animation-delay:var(--d,0s)}
.sa{font-family:var(--sans);font-size:.85rem;color:var(--tinta-suave);margin-top:10px}
@keyframes entra{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.refs{margin:8px 0;padding:0;list-style:none}
.refs li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--linha);padding:3px 0;font-variant-numeric:tabular-nums}
.refs li span:first-child{color:var(--referencia);font-weight:600}
.legenda{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.82rem;color:var(--tinta-suave);padding:6px 8px 4px}
.legenda span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px;background:var(--c)}
footer{margin-top:22px;font-size:.85rem;color:var(--tinta-suave);max-width:80ch}
@media (prefers-reduced-motion: reduce){.v,.r{animation:none}}
:root{--ciclo0:#4F6D8F}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ciclo0:#93AECF}}
:root[data-theme="dark"]{--ciclo0:#93AECF}
.abas{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--linha);margin:0 0 16px}
.abas button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:8px 12px;color:var(--tinta-suave);font-weight:600}
.abas button[aria-selected="true"]{color:var(--tinta);border-bottom-color:var(--avaliado)}
.grupo{display:contents}
.grupo[hidden]{display:none}
.coef{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.92rem;margin:8px 0}
.coef th,.coef td{padding:3px 6px;border-bottom:1px solid var(--linha);text-align:right}
.coef th:first-child,.coef td:first-child{text-align:left}
.coef th{color:var(--tinta-suave);font-weight:600}
.trilha{display:block;width:100%;height:auto;margin:8px 0}
</style>
</head>
<body>
<div class="pagina">
  <h1>Do RREO ao escore, da fronteira ao segundo estágio</h1>
  <p class="lead">Acompanhe as fórmulas do projeto com os dados reais de cada município. Os valores entram nas expressões, o resultado aparece no gráfico e a animação segue para o próximo caso.</p>

  <div class="abas" role="tablist" aria-label="Etapa do método">
    <button role="tab" id="aba-trat" aria-selected="true">Tratamento dos dados</button>
    <button role="tab" id="aba-dea" aria-selected="false">Eficiência pela DEA</button>
    <button role="tab" id="aba-malm" aria-selected="false">Produtividade pelo Malmquist</button>
    <button role="tab" id="aba-tobit" aria-selected="false">Segundo estágio pelo Tobit</button>
  </div>

  <div class="controles">
    <div class="grupo" id="ctl-trat">
      <label class="campo">Ciclo do SAEB<select id="ciclo-trat"></select></label>
      <label class="campo">Município<select id="mun-trat"></select></label>
    </div>
    <div class="grupo" id="ctl-dea" hidden>
      <label class="campo">Ciclo do SAEB<select id="ciclo"></select></label>
      <label class="campo">Insumo<select id="insumo">
        <option value="ponderado">Gasto ponderado pelo FUNDEB</option>
        <option value="original">Gasto por aluno original</option>
      </select></label>
      <label class="campo">Município<select id="municipio"></select></label>
    </div>
    <div class="grupo" id="ctl-malm" hidden>
      <label class="campo">Transição<select id="transicao"></select></label>
      <label class="campo">Origem da escala<select id="desloc">
        <option value="0">Escala original do SAEB</option>
        <option value="100">Origem deslocada em 100 pontos</option>
      </select></label>
      <label class="campo">Município<select id="mun-malm"></select></label>
    </div>
    <div class="grupo" id="ctl-tobit" hidden>
      <label class="campo">Ciclo<select id="ciclo-tobit"></select></label>
      <label class="campo">Município<select id="mun-tobit"></select></label>
    </div>
    <div class="botoes" role="group" aria-label="Controle da animação">
      <button id="voltar" aria-label="Passo anterior">◀ Passo</button>
      <button id="tocar" class="primario">Reproduzir</button>
      <button id="avancar" aria-label="Próximo passo">Passo ▶</button>
      <button id="proximo">Próximo município</button>
    </div>
    <label class="campo">Velocidade<input id="velocidade" type="range" min="0.5" max="2" step="0.25" value="1"></label>
  </div>

  <div class="grade">
    <div class="plano">
      <svg id="grafico" viewBox="0 0 640 520" role="img" aria-label="Gráfico do passo atual"></svg>
      <svg id="faixa" viewBox="0 0 640 104" role="img" aria-label="Gasto por aluno dos municípios no ciclo"></svg>
      <div class="legenda" id="legenda"></div>
    </div>
    <section class="painel" aria-live="polite">
      <ol class="passos" id="passos"></ol>
      <div id="conteudo"></div>
    </section>
  </div>

  <footer id="rodape"></footer>
</div>

function mostrarEixos(s){ [gx,gy,tx,ty].forEach(g=>g.style("display",s?null:"none")); camada.attr("clip-path", s?"url(#corte)":null); }
function eixos(ms, fmtX=fi, fmtY=fi){
  gx.transition().duration(ms).call(d3.axisBottom(x).ticks(7).tickFormat(fmtX));
  gy.transition().duration(ms).call(d3.axisLeft(y).ticks(7).tickFormat(fmtY));
}
function rotulo(px,py,txt,cor,dx=8,dy=-8){
  const fim = px > W - 170;
  gRotulos.append("text").attr("class","rotulo").attr("x",fim ? px-Math.abs(dx) : px+dx).attr("y",py+dy)
    .attr("text-anchor",fim ? "end" : "start").attr("fill",cor).text(txt)
    .attr("opacity",0).transition().duration(T(400)).attr("opacity",1);
}
function limparTudo(){
  [gFundo,gLinhas,gExtra,gRotulos,gFaixaExtra].forEach(g=>g.selectAll("*").interrupt().remove());
}
function legenda(itens){
  document.getElementById("legenda").innerHTML = itens.map(([c,t])=>`<span style="--c:var(${c})">${t}</span>`).join("");
}
function preencher(sel, opcoes){ sel.innerHTML=""; opcoes.forEach(([t,val])=>sel.add(new Option(t,val))); }

/* =====================================================================
   Módulo DEA
   ===================================================================== */
const dea = (()=>{
  const selCiclo = document.getElementById("ciclo"), selIns = document.getElementById("insumo"), selMun = document.getElementById("municipio");
  preencher(selCiclo, Object.keys(DEA).map(c=>[c,c])); selCiclo.value = "2015";
  let lista=[], i=0, dom=null;
  const passos = ["Gasto anual","Insumo do ciclo","Posição no plano","Problema linear","Expansão radial","Referências e alvos"];
  const dur = [3600,3200,2600,4800,5200,6800];
  function metr(d){ return {E:1/d.phi, rm:d.phi*d.ym, rp:d.phi*d.yp, am:d.phi*d.ym+d.sm, ap:d.phi*d.yp+d.sp, ax:d.x-d.sx}; }
  function carregar(manter){
    const nome = manter && lista[i] ? lista[i].n : null;
    lista = DEA[selCiclo.value][selIns.value];
    const ordem = lista.map((d,k)=>({n:d.n,k})).sort((a,b)=>a.n.localeCompare(b.n,"pt-BR"));
    preencher(selMun, ordem.map(o=>[o.n,o.k]));
    const ach = nome ? lista.findIndex(d=>d.n===nome) : -1; i = ach>=0 ? ach : ordem[0].k; selMun.value=i;
    const xs=lista.map(d=>d.ym), ys=lista.map(d=>d.yp);
    dom = {x:[d3.min(xs)-8,d3.max(xs)+8], y:[d3.min(ys)-8,d3.max(ys)+8]};
  }
  function montar(){
    mostrarEixos(true); tx.text("Proficiência em Matemática no 5º ano"); ty.text("Proficiência em Língua Portuguesa no 5º ano");
    x.domain(dom.x); y.domain(dom.y); eixos(0);
    gPontos.selectAll("*").remove();
    gPontos.selectAll("circle").data(lista).join("circle").attr("r",4.2).attr("fill","var(--ponto)").attr("cx",d=>x(d.ym)).attr("cy",d=>y(d.yp));
    d3.select("#faixa").style("display",null);
    tfaixa.text("Gasto por aluno do ciclo, em R$ de 2025");
    const g2=lista.map(d=>d.x); fx.domain([d3.min(g2)*0.95,d3.max(g2)*1.03]);
    gfx.call(d3.axisBottom(fx).ticks(6).tickFormat(fi));
    gTicks.selectAll("*").remove();
    gTicks.selectAll("line").data(lista).join("line").attr("x1",d=>fx(d.x)).attr("x2",d=>fx(d.x)).attr("y1",22).attr("y2",44).attr("stroke","var(--ponto)").attr("stroke-width",1.5);
    legenda([["--ponto","Demais municípios"],["--avaliado","Município avaliado"],["--referencia","Referências"],["--alvo","Alvo"]]);
    document.getElementById("rodape").textContent = "Especificação BCC orientada a produtos, com um insumo e dois produtos, estimada separadamente em cada ciclo. As folgas vêm da segunda etapa, com φ fixado na solução da primeira. Valores em reais de 2025. As fórmulas seguem a numeração do projeto de qualificação.";
  }
  function reset(){
    limparTudo();
    gPontos.selectAll("circle").interrupt().attr("fill","var(--ponto)").attr("r",4.2);
    gTicks.selectAll("line").attr("stroke","var(--ponto)").attr("stroke-width",1.5);
  }
  function repos(ms){ gPontos.selectAll("circle").transition().duration(ms).attr("cx",d=>x(d.ym)).attr("cy",d=>y(d.yp)); }
  function marcar(){
    const d=lista[i];
    gPontos.selectAll("circle").filter(e=>e===d).raise().attr("fill","var(--avaliado)").attr("r",6.5);
    rotulo(x(d.ym),y(d.yp),d.n,"var(--avaliado)");
  }
  function html(p){
    const d=lista[i], c=+selCiclo.value, m=metr(d), N=lista.length, pond=selIns.value==="ponderado";
    const matTxt = pond ? "matrículas em aluno equivalente, com anos iniciais × 1,00 e anos finais × 1,10" : "matrículas municipais do Ensino Fundamental";
    const cab = `<p class="municipio">${d.n} <span class="nota">(${i+1} de ${N} no ciclo ${c})</span></p>`;
    if(p===0) return cab+`<h2>Gasto real por aluno em cada ano</h2><p>A despesa real liquidada do Ensino Fundamental é dividida pelas ${matTxt}.</p>
      <div class="eq"><i>G</i><sub>i,${c-1}</sub> = <i>Desp</i><sup>R</sup> ⁄ <i>Mat</i> = ${v(R(d.d0),.2)} ⁄ ${v(f(d.m0),.5)} = ${r(R(d.g0),.9)}<span class="num">(1)</span></div>
      <div class="eq"><i>G</i><sub>i,${c}</sub> = <i>Desp</i><sup>R</sup> ⁄ <i>Mat</i> = ${v(R(d.d1),1.4)} ⁄ ${v(f(d.m1),1.7)} = ${r(R(d.g1),2.1)}<span class="num">(1)</span></div>`;
    if(p===1) return cab+`<h2>Insumo do ciclo</h2><p>O insumo é a média do gasto por aluno do ano da avaliação e do ano anterior.</p>
      <div class="eq"><i>X</i><sub>i,${c}</sub> = (<i>G</i><sub>i,${c-1}</sub> + <i>G</i><sub>i,${c}</sub>) ⁄ 2 = (${v(R(d.g0),.2)} + ${v(R(d.g1),.5)}) ⁄ 2 = ${r(R(d.x),1)}<span class="num">(2)</span></div>
      <p class="nota">A faixa abaixo do gráfico mostra o gasto de cada município do ciclo. O traço em destaque é o município avaliado.</p>`;
    if(p===2) return cab+`<h2>Posição no plano</h2><p>Os dois produtos definem o ponto do município no plano cartesiano.</p>
      <div class="eq"><i>Y</i><sub>mat,i</sub> = ${r(f(d.ym),.2)}&nbsp;&nbsp;&nbsp;<i>Y</i><sub>port,i</sub> = ${r(f(d.yp),.5)}</div>
      <p class="nota">Cada ponto cinza é outra rede municipal do ciclo. A DEA compara o município com combinações dessas redes.</p>`;
    if(p===3) return cab+`<h2>Problema linear do município</h2><p>O modelo procura o maior fator φ que ainda pode ser alcançado por uma combinação das redes do ciclo.</p>
      <div class="eq">max φ<sub>i</sub><span class="num">(3)</span></div><div class="sa">sujeito a</div>
      <div class="eq">Σ<sub>j=1</sub><sup>${N}</sup> λ<sub>j</sub> <i>X</i><sub>j</sub> ≤ ${v(R(d.x),.3)}<span class="num">(4)</span></div>
      <div class="eq">Σ<sub>j=1</sub><sup>${N}</sup> λ<sub>j</sub> <i>Y</i><sub>mat,j</sub> ≥ φ<sub>i</sub> · ${v(f(d.ym),.8)}<span class="num">(5)</span></div>
      <div class="eq">Σ<sub>j=1</sub><sup>${N}</sup> λ<sub>j</sub> <i>Y</i><sub>port,j</sub> ≥ φ<sub>i</sub> · ${v(f(d.yp),1.2)}<span class="num">(5)</span></div>
      <div class="eq">Σ<sub>j=1</sub><sup>${N}</sup> λ<sub>j</sub> = 1<span class="num">(6)</span></div>
      <div class="eq">λ<sub>j</sub> ≥ 0<span class="num">(7)</span></div>
      <p class="nota">A restrição (6) define retornos variáveis de escala. Sem ela, o modelo vira CRS.</p>`;
    if(p===4){ const ef=Math.abs(d.phi-1)<1e-6;
      return cab+`<h2>Expansão radial</h2><p>A semirreta parte do zero da escala do SAEB, passa pelo município e para na fronteira.</p>
      <div class="eq">φ<sub>i</sub><sup>*</sup> = ${r(f(d.phi,4),.3)}</div>
      <div class="eq">φ<sup>*</sup> · <i>Y</i> = (${v(f(m.rm),1)} ; ${v(f(m.rp),1.2)})</div>
      <div class="eq"><i>E</i><sub>i</sub> = 1 ⁄ φ<sub>i</sub><sup>*</sup> = 1 ⁄ ${v(f(d.phi,4),1.6)} = ${r(f(m.E,4),2)}<span class="num">(8)</span></div>
      <p>${ef?"O município está na fronteira. O modelo não encontra expansão proporcional dos produtos.":`Com o mesmo gasto, a combinação de referência alcança ${f((d.phi-1)*100,1)}% a mais nos dois produtos.`}</p>
      <p class="nota">O percentual depende da origem da escala. Por isso a leitura recomendada usa a posição no ranking e a distância em pontos.</p>`; }
    const refs=Object.entries(d.lam).map(([k,l])=>({n:lista[k].n,l})).sort((a,b)=>b.l-a.l);
    const lx=Object.entries(d.lam).reduce((s,[k,l])=>s+l*lista[k].x,0), lm=Object.entries(d.lam).reduce((s,[k,l])=>s+l*lista[k].ym,0), lp=Object.entries(d.lam).reduce((s,[k,l])=>s+l*lista[k].yp,0);
    return cab+`<h2>Referências, folgas e alvos</h2><p>A segunda etapa fixa φ<sup>*</sup> e maximiza as folgas. Os pesos λ indicam as redes de referência.</p>
      <ul class="refs">${refs.map(e=>`<li><span>${e.n}</span><span>λ = ${f(e.l,4)}</span></li>`).join("")}</ul>
      <div class="eq">Σλ<i>X</i> + <i>s</i><sup>−</sup> = ${v(R(lx),.3)} + ${v(R(d.sx),.5)} = ${r(R(d.x),.8)}<span class="num">(10)</span></div>
      <div class="eq">Σλ<i>Y</i><sub>mat</sub> − <i>s</i><sup>+</sup> = ${v(f(lm),1.1)} − ${v(f(d.sm),1.3)} = ${r(f(m.rm),1.6)}<span class="num">(11)</span></div>
      <div class="eq">Σλ<i>Y</i><sub>port</sub> − <i>s</i><sup>+</sup> = ${v(f(lp),1.9)} − ${v(f(d.sp),2.1)} = ${r(f(m.rp),2.4)}<span class="num">(11)</span></div>
      <div class="eq"><i>Y</i><sup>alvo</sup> = φ<sup>*</sup><i>Y</i> + <i>s</i><sup>+*</sup> = (${r(f(m.am),2.8)} ; ${r(f(m.ap),3)})<span class="num">(14)</span></div>
      <div class="eq"><i>X</i><sup>alvo</sup> = <i>X</i> − <i>s</i><sup>−*</sup> = ${r(R(m.ax),3.3)}<span class="num">(15)</span></div>
      <p class="nota">Distância até o alvo em pontos. Matemática +${f(m.am-d.ym)} e Língua Portuguesa +${f(m.ap-d.yp)}.</p>`;
  }
  function cena(p, imediato){
    const d=lista[i], m=metr(d);
    reset();
    if(p<4||imediato){ x.domain(dom.x); y.domain(dom.y); eixos(0); repos(0); }
    if(p>=1) gTicks.selectAll("line").filter(e=>e===d).raise().attr("stroke","var(--avaliado)").attr("stroke-width",3);
    if(p===1) gFaixaExtra.append("text").attr("class","rotulo").attr("x",fx(d.x)).attr("y",82).attr("text-anchor","middle").attr("fill","var(--avaliado)").text(`município ${R(d.x)}`);
    if(p<2) return;
    marcar();
    if(p===2){ gPontos.selectAll("circle").filter(e=>e===d).attr("r",0).transition().duration(T(700)).attr("r",6.5); return; }
    if(p===3) return;
    const raio=()=>{ gLinhas.selectAll("*").remove();
      gLinhas.append("line").attr("x1",x(0)).attr("y1",y(0)).attr("x2",x(m.rm)).attr("y2",y(m.rp)).attr("stroke","var(--avaliado)").attr("stroke-width",1.6).attr("stroke-dasharray","5 4");
      gExtra.append("circle").attr("cx",x(m.rm)).attr("cy",y(m.rp)).attr("r",5).attr("fill","none").attr("stroke","var(--avaliado)").attr("stroke-width",2); };
    if(p===4 && !imediato){
      const t1=T(1000), t2=T(1400), t3=T(900);
      x.domain([0,dom.x[1]]); y.domain([0,dom.y[1]]); eixos(t1); repos(t1); gRotulos.selectAll("*").remove();
      agenda(()=>{ gLinhas.append("line").attr("x1",x(0)).attr("y1",y(0)).attr("x2",x(0)).attr("y2",y(0)).attr("stroke","var(--avaliado)").attr("stroke-width",1.6).attr("stroke-dasharray","5 4")
        .transition().duration(t2).ease(d3.easeCubicOut).attr("x2",x(m.rm)).attr("y2",y(m.rp)); }, t1);
      agenda(()=>{ x.domain(dom.x); y.domain(dom.y); eixos(t3); repos(t3);
        agenda(()=>{ raio(); marcar(); rotulo(x(m.rm),y(m.rp),`φ* = ${f(d.phi,4)}`,"var(--avaliado)",8,14); }, t3); }, t1+t2+T(500));
      return;
    }
    raio();
    if(p===4){ rotulo(x(m.rm),y(m.rp),`φ* = ${f(d.phi,4)}`,"var(--avaliado)",8,14); return; }
    const refs=Object.entries(d.lam).map(([k,l])=>({e:lista[k],l}));
    refs.forEach((o,q)=>{
      gPontos.selectAll("circle").filter(e=>e===o.e).raise().transition().delay(T(250*q)).duration(T(400)).attr("fill","var(--referencia)").attr("r",6.5);
      gLinhas.append("line").attr("x1",x(o.e.ym)).attr("y1",y(o.e.yp)).attr("x2",x(o.e.ym)).attr("y2",y(o.e.yp)).attr("stroke","var(--referencia)").attr("stroke-width",1.2)
        .transition().delay(T(600+250*q)).duration(T(700)).attr("x2",x(m.am)).attr("y2",y(m.ap));
      if(o.e!==d) agenda(()=>rotulo(x(o.e.ym),y(o.e.yp),`${o.e.n} λ=${f(o.l,2)}`,"var(--referencia)"), T(250*q));
      gTicks.selectAll("line").filter(e=>e===o.e).raise().attr("stroke","var(--referencia)").attr("stroke-width",2.5);
    });
    if(d.sm>1e-4||d.sp>1e-4) gLinhas.append("line").attr("x1",x(m.rm)).attr("y1",y(m.rp)).attr("x2",x(m.rm)).attr("y2",y(m.rp)).attr("stroke","var(--alvo)").attr("stroke-width",1.6).attr("stroke-dasharray","2 3")
      .transition().delay(T(1400)).duration(T(700)).attr("x2",x(m.am)).attr("y2",y(m.ap));
    gExtra.append("rect").attr("x",x(m.am)-5).attr("y",y(m.ap)-5).attr("width",10).attr("height",10).attr("fill","var(--alvo)").attr("transform",`rotate(45 ${x(m.am)} ${y(m.ap)})`)
      .attr("opacity",0).transition().delay(T(1800)).duration(T(400)).attr("opacity",1);
    agenda(()=>rotulo(x(m.am),y(m.ap),"alvo","var(--alvo)",10,18), T(1900));
    gFaixaExtra.append("line").attr("x1",fx(m.ax)).attr("x2",fx(m.ax)).attr("y1",20).attr("y2",46).attr("stroke","var(--alvo)").attr("stroke-width",2.5).attr("stroke-dasharray","3 2");
    gFaixaExtra.append("text").attr("class","rotulo").attr("x",fx(d.x)).attr("y",82).attr("text-anchor","middle").attr("fill","var(--avaliado)").text(`município ${R(d.x)}`);
    if(d.sx>1) gFaixaExtra.append("text").attr("class","rotulo").attr("x",fx(m.ax)).attr("y",98).attr("text-anchor","middle").attr("fill","var(--alvo)").text(`alvo ${R(m.ax)}`);
  }
  [selCiclo,selIns].forEach(s=>s.addEventListener("change",()=>{ carregar(true); montar(); player.inicio(); }));
  selMun.addEventListener("change",()=>{ i=+selMun.value; player.inicio(); });
  carregar(false);
  return { passos, dur, html, cena, montar, proximo(){ i=(i+1)%lista.length; selMun.value=i; }, controle:"ctl-dea" };
})();

/* =====================================================================
   Módulo Malmquist
   ===================================================================== */
const malm = (()=>{
  const selT = document.getElementById("transicao"), selK = document.getElementById("desloc"), selMun = document.getElementById("mun-malm");
  const C = MALM.ciclos, trans = C.slice(0,-1).map((c,k)=>[c,C[k+1]]);
  preencher(selT, trans.map(([a,b])=>[`${a} para ${b}`,`${a}-${b}`]));
  const ordem = MALM.nomes.map((n,k)=>({n,k})).sort((a,b)=>a.n.localeCompare(b.n,"pt-BR"));
  preencher(selMun, ordem.map(o=>[o.n,o.k]));
  let i = ordem[0].k; selMun.value = i;
  const passos = ["Produto por real","Duas fronteiras","Distâncias no próprio ciclo","Distâncias cruzadas","Índice e decomposição","Eficiência pura e escala","Acumulado e média"];
  const dur = [3600,3600,5200,5600,5600,5200,6000];
  const dados = () => { const [a,b]=selT.value.split("-"); const K=MALM.k[selK.value];
    return {c0:a,c1:b,K,P0:K.pts[a],P1:K.pts[b],L:K.trans[selT.value]}; };
  const ind = dd => { const [D00,D11,D01,D10,V0,V1]=dd;
    const mpi=Math.sqrt(D01/D00*D11/D10), effch=D11/D00, techch=Math.sqrt(D01/D11*D00/D10), pech=V1/V0;
    return {D00,D11,D01,D10,V0,V1,mpi,effch,techch,pech,sech:effch/pech}; };
  const gm = a => Math.exp(d3.mean(a.map(Math.log)));
  function montar(){
    const {P0,P1}=dados();
    const all=P0.z.concat(P1.z);
    mostrarEixos(true); tx.text(`Pontos em Matemática por R$ 1.000 de gasto por aluno${selK.value!=="0"?" (origem deslocada)":""}`);
    ty.text("Pontos em Língua Portuguesa por R$ 1.000");
    x.domain([0,d3.max(all,d=>d[0])*1.08]); y.domain([0,d3.max(all,d=>d[1])*1.08]); eixos(0, fi, fi);
    gPontos.selectAll("*").remove();
    d3.select("#faixa").style("display","none");
    legenda([["--ciclo0",`Ciclo ${dados().c0} e fronteira`],["--referencia",`Ciclo ${dados().c1} e fronteira`],["--avaliado","Município avaliado"]]);
    document.getElementById("rodape").textContent = "Malmquist orientado a produtos sob retornos constantes de escala, no painel balanceado de 46 municípios, com insumo ponderado pelo FUNDEB. Com um insumo e retornos constantes, a fronteira pode ser desenhada no plano dos produtos por real gasto. A distância é a razão entre o comprimento até o ponto e o comprimento até a fronteira, medidos a partir da origem. O PECH usa escores VRS do próprio painel balanceado.";
  }
  function pontos(){
    const {P0,P1}=dados();
    gPontos.selectAll("*").remove();
    gPontos.selectAll("c0").data(P0.z).join("circle").attr("r",3.6).attr("fill","var(--ciclo0)").attr("opacity",.55).attr("cx",d=>x(d[0])).attr("cy",d=>y(d[1]));
    gPontos.selectAll("c1").data(P1.z).join("circle").attr("r",3.6).attr("fill","var(--referencia)").attr("opacity",.55).attr("cx",d=>x(d[0])).attr("cy",d=>y(d[1]));
  }
  function fronteira(h, cor, anim){
    const line=d3.line().x(d=>x(d[0])).y(d=>y(d[1]));
    const pts=[[0,h[0][1]], ...h, [h[h.length-1][0],0]];
    const p=gFundo.append("path").attr("d",line(pts)).attr("fill","none").attr("stroke",cor).attr("stroke-width",2);
    if(anim && !reduz){ const L=p.node().getTotalLength(); p.attr("stroke-dasharray",`${L} ${L}`).attr("stroke-dashoffset",L).transition().duration(T(1400)).attr("stroke-dashoffset",0); }
  }
  function raio(pt, D, cor, txt, atraso){
    const fr=[pt[0]/D, pt[1]/D], end = D>1 ? pt : fr;
    agenda(()=>{
      gLinhas.append("line").attr("x1",x(0)).attr("y1",y(0)).attr("x2",x(0)).attr("y2",y(0)).attr("stroke",cor).attr("stroke-width",1.5).attr("stroke-dasharray","5 4")
        .transition().duration(T(900)).attr("x2",x(end[0])).attr("y2",y(end[1]));
      agenda(()=>{ gExtra.append("circle").attr("cx",x(fr[0])).attr("cy",y(fr[1])).attr("r",4.5).attr("fill","none").attr("stroke",cor).attr("stroke-width",2);
        rotulo(x(fr[0]),y(fr[1]),txt,cor,8,14); }, T(900));
    }, atraso);
  }
  function marcar(){
    const {P0,P1}=dados(), a=P0.z[i], b=P1.z[i];
    gLinhas.append("line").attr("x1",x(a[0])).attr("y1",y(a[1])).attr("x2",x(b[0])).attr("y2",y(b[1])).attr("stroke","var(--avaliado)").attr("stroke-width",1).attr("opacity",.6);
    gExtra.append("circle").attr("cx",x(a[0])).attr("cy",y(a[1])).attr("r",6).attr("fill","var(--ciclo0)").attr("stroke","var(--avaliado)").attr("stroke-width",2.5);
    gExtra.append("circle").attr("cx",x(b[0])).attr("cy",y(b[1])).attr("r",6).attr("fill","var(--referencia)").attr("stroke","var(--avaliado)").attr("stroke-width",2.5);
    rotulo(x(a[0]),y(a[1]),dados().c0,"var(--ciclo0)",-34,4); rotulo(x(b[0]),y(b[1]),dados().c1,"var(--referencia)",9,4);
  }
  function html(p){
    const {c0,c1,L}=dados(), q=ind(L[i]), n=MALM.nomes[i], X0=MALM.X[c0][i], X1=MALM.X[c1][i], Y0=MALM.Y[c0][i], Y1=MALM.Y[c1][i];
    const k=+selK.value;
    const cab=`<p class="municipio">${n} <span class="nota">(transição ${c0} para ${c1}${k?", origem deslocada em 100 pontos":""})</span></p>`;
    const Dc=(fr,dt)=>`<i>D</i><sub>${fr}</sub>(<i>X</i><sub>${dt}</sub>, <i>Y</i><sub>${dt}</sub>)`;
    if(p===0) return cab+`<h2>Produto por real gasto</h2><p>Com um insumo e retornos constantes de escala, dividir os produtos pelo insumo leva a fronteira para um plano. Cada ponto mostra quanto a rede entrega por R$ 1.000 de gasto por aluno.</p>
      <div class="eq">${c0} &nbsp; (${v(f(Y0[0]-k),.2)} ; ${v(f(Y0[1]-k),.3)}) ⁄ ${v(R(X0),.5)} × 1.000 = (${r(f((Y0[0]-k)/X0*1000,2),.9)} ; ${r(f((Y0[1]-k)/X0*1000,2),1)})</div>
      <div class="eq">${c1} &nbsp; (${v(f(Y1[0]-k),1.3)} ; ${v(f(Y1[1]-k),1.4)}) ⁄ ${v(R(X1),1.6)} × 1.000 = (${r(f((Y1[0]-k)/X1*1000,2),2)} ; ${r(f((Y1[1]-k)/X1*1000,2),2.1)})</div>
      <p class="nota">Os pontos azuis são os municípios em ${c0}. Os verdes são os mesmos municípios em ${c1}.</p>`;
    if(p===1) return cab+`<h2>Duas fronteiras</h2><p>A fronteira de cada ciclo envolve as melhores combinações de produto por real. Quando a fronteira de ${c1} fica dentro da de ${c0}, o conjunto de redes passou a entregar menos por real gasto.</p>
      <p class="nota">O deslocamento entre as duas linhas é o que o componente TECHCH vai medir.</p>`;
    if(p===2) return cab+`<h2>Distâncias no próprio ciclo</h2><p>Cada posição do município é comparada com a fronteira do mesmo ciclo. A distância é o inverso do fator de expansão dos produtos.</p>
      <div class="eq">${Dc("c","c")} = ${r(f(q.D00,4),.6)}</div>
      <div class="eq">${Dc("c′","c′")} = ${r(f(q.D11,4),2.4)}</div>
      <p class="nota">Valores iguais a um indicam o município sobre a fronteira do ciclo.</p>`;
    if(p===3) return cab+`<h2>Distâncias cruzadas</h2><p>Agora cada posição é comparada com a fronteira do outro ciclo. A distância pode passar de um quando o ponto fica além da fronteira de referência.</p>
      <div class="eq">${Dc("c","c′")} = ${r(f(q.D01,4),.6)}</div>
      <div class="eq">${Dc("c′","c")} = ${r(f(q.D10,4),2.4)}</div>
      <p class="nota">Com retornos constantes, os quatro problemas sempre têm solução quando insumo e produtos são positivos.</p>`;
    if(p===4) return cab+`<h2>Índice e decomposição</h2>
      <div class="eq">MPI = [ ${v(f(q.D01,4),.2)} ⁄ ${v(f(q.D00,4),.3)} · ${v(f(q.D11,4),.4)} ⁄ ${v(f(q.D10,4),.5)} ]<sup>1/2</sup> = ${r(f(q.mpi,4),.9)}<span class="num">(16)</span></div>
      <div class="eq">EFFCH = ${v(f(q.D11,4),1.3)} ⁄ ${v(f(q.D00,4),1.4)} = ${r(f(q.effch,4),1.7)}<span class="num">(18)</span></div>
      <div class="eq">TECHCH = [ ${v(f(q.D01,4),2.1)} ⁄ ${v(f(q.D11,4),2.2)} · ${v(f(q.D00,4),2.3)} ⁄ ${v(f(q.D10,4),2.4)} ]<sup>1/2</sup> = ${r(f(q.techch,4),2.8)}<span class="num">(19)</span></div>
      <p>${q.mpi>1?"A produtividade do município cresceu na transição.":"A produtividade do município recuou na transição."} ${q.techch>1?"A fronteira avançou.":"A fronteira recuou."} ${q.effch>1?"O município se aproximou da fronteira.":"O município se afastou da fronteira."}</p>`;
    if(p===5) return cab+`<h2>Eficiência pura e de escala</h2><p>O EFFCH se divide entre a mudança da eficiência VRS e a mudança de escala.</p>
      <div class="eq">PECH = <i>E</i><sup>VRS</sup><sub>c′</sub> ⁄ <i>E</i><sup>VRS</sup><sub>c</sub> = ${v(f(q.V1,4),.3)} ⁄ ${v(f(q.V0,4),.5)} = ${r(f(q.pech,4),.8)}<span class="num">(20)</span></div>
      <div class="eq">SECH = EFFCH ⁄ PECH = ${v(f(q.effch,4),1.2)} ⁄ ${v(f(q.pech,4),1.4)} = ${r(f(q.sech,4),1.7)}<span class="num">(21)</span></div>
      <div class="eq">MPI = ${v(f(q.techch,4),2.1)} × ${v(f(q.pech,4),2.2)} × ${v(f(q.sech,4),2.3)} = ${r(f(q.mpi,4),2.6)}<span class="num">(17)</span></div>
      <p class="nota">Como o insumo é gasto por aluno, a escala se refere ao nível do gasto e não ao porte da rede.</p>`;
    const K=MALM.k[selK.value], serie=trans.map(([a,b])=>ind(K.trans[`${a}-${b}`][i]).mpi);
    let acc=1; const accs=serie.map(s=>acc*=s);
    const tr=L.map(dd=>ind(dd)), mg=gm(tr.map(t=>t.mpi)), tg=gm(tr.map(t=>t.techch)), eg=gm(tr.map(t=>t.effch));
    const sw=300, sh=90, sx=d3.scaleLinear().domain([0,5]).range([30,sw-10]), sy=d3.scaleLinear().domain([Math.min(0.4,d3.min(accs)*0.95),Math.max(1.1,d3.max(accs)*1.05)]).range([sh-18,8]);
    const pth=d3.line().x((d,k)=>sx(k)).y(d=>sy(d))([1,...accs]);
    const trilha=`<svg class="trilha" viewBox="0 0 ${sw} ${sh}" role="img" aria-label="Índice acumulado do município">
      <line x1="30" x2="${sw-10}" y1="${sy(1)}" y2="${sy(1)}" stroke="var(--linha)"/>
      <path d="${pth}" fill="none" stroke="var(--avaliado)" stroke-width="2"/>
      ${[1,...accs].map((d,k)=>`<circle cx="${sx(k)}" cy="${sy(d)}" r="3" fill="var(--avaliado)"/>`).join("")}
      ${C.map((c,k)=>`<text x="${sx(k)}" y="${sh-3}" text-anchor="middle" font-size="9" fill="var(--tinta-suave)">${c}</text>`).join("")}
      <text x="2" y="${sy(1)+3}" font-size="9" fill="var(--tinta-suave)">1,0</text></svg>`;
    return cab+`<h2>Acumulado e média</h2><p>O índice acumulado multiplica as cinco transições do município.</p>
      <div class="eq">MPI<sup>acum</sup> = ${serie.map((s,k)=>v(f(s,3),.2+.2*k)).join(" × ")} = ${r(f(accs[4],4),1.4)}<span class="num">(22)</span></div>
      ${trilha}
      <p>A média geométrica resume a transição ${c0} para ${c1} entre os ${L.length} municípios.</p>
      <div class="eq">MG<sub>MPI</sub> = ${r(f(mg,4),2)}&nbsp; TECHCH ${v(f(tg,4),2.2)}&nbsp; EFFCH ${v(f(eg,4),2.3)}<span class="num">(23)</span></div>
      <p class="nota">${tr.filter(t=>t.mpi>1).length} de ${L.length} municípios tiveram ganho de produtividade na transição. Compare o resultado com a origem deslocada no seletor.</p>`;
  }
  function cena(p){
    limparTudo(); montar(); pontos();
    const {P0,P1,L}=dados(), q=ind(L[i]), a=P0.z[i], b=P1.z[i];
    if(p>=1){ fronteira(P0.hull,"var(--ciclo0)",p===1); fronteira(P1.hull,"var(--referencia)",p===1); }
    marcar();
    if(p===2){ raio(a,q.D00,"var(--ciclo0)",`D = ${f(q.D00,3)}`,T(300)); raio(b,q.D11,"var(--referencia)",`D = ${f(q.D11,3)}`,T(2100)); }
    if(p===3){ raio(b,q.D01,"var(--ciclo0)",`D = ${f(q.D01,3)}`,T(300)); raio(a,q.D10,"var(--referencia)",`D = ${f(q.D10,3)}`,T(2100)); }
  }
  [selT,selK].forEach(s=>s.addEventListener("change",()=>player.inicio(true)));
  selMun.addEventListener("change",()=>{ i=+selMun.value; player.inicio(); });
  return { passos, dur, html, cena:(p)=>cena(p), montar, proximo(){ const pos=ordem.findIndex(o=>o.k===i); i=ordem[(pos+1)%ordem.length].k; selMun.value=i; }, controle:"ctl-malm" };
})();

/* =====================================================================
   Módulo Tobit
   ===================================================================== */
const tobit = (()=>{
  const selC = document.getElementById("ciclo-tobit"), selMun = document.getElementById("mun-tobit");
  const ciclos=[...new Set(TOB.obs.map(o=>o.ciclo))].sort();
  preencher(selC, [["Todos os ciclos","todos"], ...ciclos.map(c=>[String(c),c])]);
  const b=TOB.b, s=Math.sqrt(TOB.su**2+TOB.se_e**2);
  const lat = o => o.xb;
  const cpar = o => (1-lat(o))/s;
  const esper = mu => { const c=(1-mu)/s; return mu*Phi(c) - s*phi(c) + (1-Phi(c)); };
  let lista=[], i=0;
  function carregar(){
    lista = TOB.obs.map((o,k)=>({...o,k})).filter(o=>selC.value==="todos"||String(o.ciclo)===selC.value).sort((a,b)=>a.municipio.localeCompare(b.municipio,"pt-BR")||a.ciclo-b.ciclo);
    preencher(selMun, lista.map((o,k)=>[`${o.municipio} ${o.ciclo}`,k])); i=0; selMun.value=0;
  }
  const passos=["Dados do município","Equação latente","Censura em um","Valor esperado","Efeitos marginais"];
  const dur=[3400,5200,5400,5200,6400];
  function montar(){
    const xs=TOB.obs.map(lat), ys=TOB.obs.map(o=>o.E);
    x.domain([d3.min(xs)-0.04, Math.max(1.04,d3.max(xs)+0.04)]); y.domain([Math.min(d3.min(ys),d3.min(xs))-0.04, 1.12]);
    mostrarEixos(true); tx.text("Valor previsto da variável latente, x′β"); ty.text("Escore de eficiência VRS observado");
    eixos(0, d=>f(d,2), d=>f(d,2));
    d3.select("#faixa").style("display","none");
    gPontos.selectAll("*").remove();
    gPontos.selectAll("circle").data(TOB.obs).join("circle").attr("r",3.8).attr("fill","var(--ponto)").attr("opacity",.8).attr("cx",o=>x(lat(o))).attr("cy",o=>y(o.E));
    legenda([["--ponto","Município e ciclo"],["--avaliado","Caso avaliado"],["--ciclo0","Reta latente"],["--alvo","Valor esperado"]]);
    document.getElementById("rodape").textContent = `Tobit em painel com efeitos aleatórios e censura superior em um, estimado por máxima verossimilhança com quadratura de Gauss-Hermite. São ${TOB.N} observações de ${TOB.nmun} municípios nos ciclos com INSE disponível, dos quais ${TOB.ncens} escores iguais a um. O tempo de deslocamento até Manaus ainda não está na base e ficou fora da estimação. As previsões usam o componente municipal igual a zero e a variância total σ² = σᵤ² + σₑ². Os erros-padrão seguem a inferência convencional e não corrigem a dependência apontada por Simar e Wilson (2007).`;
  }
  function guias(){
    const d0=x.domain(), xs=d3.range(d0[0],d0[1],(d0[1]-d0[0])/120);
    gFundo.append("line").attr("x1",x(d0[0])).attr("x2",x(d0[1])).attr("y1",y(1)).attr("y2",y(1)).attr("stroke","var(--tinta-suave)").attr("stroke-width",1).attr("stroke-dasharray","2 3");
    gFundo.append("text").attr("class","rotulo").attr("x",x(d0[0])+6).attr("y",y(1)-6).attr("fill","var(--tinta-suave)").text("limite de censura em 1");
    gFundo.append("line").attr("x1",x(d0[0])).attr("y1",y(d0[0])).attr("x2",x(d0[1])).attr("y2",y(d0[1])).attr("stroke","var(--ciclo0)").attr("stroke-width",1.3).attr("stroke-dasharray","5 4");
  }
  function curva(anim){
    const d0=x.domain(), pts=d3.range(d0[0],d0[1],(d0[1]-d0[0])/160).map(m=>[m,esper(m)]);
    const p=gFundo.append("path").attr("d",d3.line().x(d=>x(d[0])).y(d=>y(d[1]))(pts)).attr("fill","none").attr("stroke","var(--alvo)").attr("stroke-width",2);
    if(anim&&!reduz){ const L=p.node().getTotalLength(); p.attr("stroke-dasharray",`${L} ${L}`).attr("stroke-dashoffset",L).transition().duration(T(1400)).attr("stroke-dashoffset",0); }
  }
  function densidade(mu, anim){
    const ys=d3.range(mu-3*s, mu+3*s, s/30), pmax=phi(0), w=70;
    const pts=ys.map(v=>[x(mu)+w*phi((v-mu)/s)/pmax, y(v)]);
    const area=d3.area().x0(x(mu)).x1(d=>d[0]).y(d=>d[1]);
    gLinhas.append("path").attr("d",d3.line()(pts)).attr("fill","none").attr("stroke","var(--avaliado)").attr("stroke-width",1.6);
    const acima=pts.filter((d,k)=>ys[k]>=1);
    if(acima.length>1) gLinhas.append("path").attr("d",area(acima)).attr("fill","var(--avaliado)").attr("opacity",0).transition().delay(anim?T(600):0).duration(T(600)).attr("opacity",.35);
    gLinhas.append("line").attr("x1",x(mu)).attr("x2",x(mu)).attr("y1",y(mu-3*s)).attr("y2",y(mu+3*s)).attr("stroke","var(--avaliado)").attr("stroke-width",1).attr("opacity",.6);
  }
  function html(p){
    const o=lista[i], mu=lat(o), c=cpar(o), pc=1-Phi(c), Ee=esper(mu);
    const cab=`<p class="municipio">${o.municipio} <span class="nota">(ciclo ${o.ciclo})</span></p>`;
    const cic = o.ciclo===2021 ? b[4] : o.ciclo===2023 ? b[5] : 0;
    if(p===0) return cab+`<h2>Dados do município</h2><p>O segundo estágio usa o escore VRS da DEA como variável dependente.</p>
      <div class="eq"><i>E</i><sub>ic</sub> = ${r(f(o.E,4),.2)}</div>
      <div class="eq">INSE = ${v(f(o.inse,2),.5)}&nbsp; docentes temporários = ${v(f(o.tmp*100,1)+"%",.7)}&nbsp; anos finais = ${v(f(o.part_af*100,1)+"%",.9)}</div>
      <p class="nota">${o.E>=1-1e-6?"O escore é igual a um. O caso fica no limite de censura.":"O escore é menor que um. O caso é observado sem censura."}</p>`;
    if(p===1) return cab+`<h2>Equação latente</h2><p>Os coeficientes estimados entram na expressão 24 com os valores do município.</p>
      <div class="eq">Ẽ<sub>ic</sub> = β<sub>0</sub> + β<sub>1</sub>INSE + γ<sub>1</sub>TEMP + γ<sub>2</sub>AF + τ<sub>c</sub> + <i>u</i><sub>i</sub> + ε<sub>ic</sub><span class="num">(24)</span></div>
      <div class="eq">x′β = ${v(f(b[0],4),.3)} + ${v(f(b[1],4),.5)} × ${v(f(o.inse,2),.6)} ${b[2]<0?"−":"+"} ${v(f(Math.abs(b[2]),4),.8)} × ${v(f(o.tmp,3),.9)} ${b[3]<0?"−":"+"} ${v(f(Math.abs(b[3]),4),1.1)} × ${v(f(o.part_af,3),1.2)} ${cic<0?"−":"+"} ${v(f(Math.abs(cic),4),1.4)}</div>
      <div class="eq">x′β = ${r(f(mu,4),1.8)}</div>
      <p class="nota">O ponto do município se desloca para a posição prevista no eixo horizontal. A reta tracejada mostra onde ficaria o escore sem censura.</p>`;
    if(p===2) return cab+`<h2>Censura em um</h2><p>A variável latente segue uma normal em torno de x′β. Toda a massa acima de um aparece como escore igual a um.</p>
      <div class="eq"><i>E</i><sub>ic</sub> = Ẽ<sub>ic</sub> se Ẽ<sub>ic</sub> &lt; 1 &nbsp; e &nbsp; <i>E</i><sub>ic</sub> = 1 se Ẽ<sub>ic</sub> ≥ 1<span class="num">(25)</span></div>
      <div class="eq">σ = (σ<sub>u</sub><sup>2</sup> + σ<sub>ε</sub><sup>2</sup>)<sup>1/2</sup> = (${v(f(TOB.su,4),.4)}<sup>2</sup> + ${v(f(TOB.se_e,4),.6)}<sup>2</sup>)<sup>1/2</sup> = ${r(f(s,4),.9)}</div>
      <div class="eq">P(<i>E</i> = 1) = 1 − Φ[(1 − ${v(f(mu,4),1.3)}) ⁄ ${v(f(s,4),1.4)}] = ${r(f(pc,4),1.8)}</div>
      <p class="nota">A área sombreada na curva do gráfico corresponde à probabilidade de o escore ficar no limite.</p>`;
    if(p===3) return cab+`<h2>Valor esperado do escore</h2><p>Com a censura, o escore esperado fica abaixo da reta latente quando x′β se aproxima de um.</p>
      <div class="eq">E[<i>E</i>] = μΦ(<i>c</i>) − σφ(<i>c</i>) + 1 − Φ(<i>c</i>)&nbsp; com <i>c</i> = (1 − μ) ⁄ σ = ${v(f(c,4),.4)}</div>
      <div class="eq">E[<i>E</i>] = ${r(f(Ee,4),1)}&nbsp; observado ${v(f(o.E,4),1.3)}&nbsp; diferença ${v(f(o.E-Ee,4),1.5)}</div>
      <p class="nota">A curva marrom liga os valores esperados. A diferença entre o observado e a curva reúne o componente municipal e o erro.</p>`;
    const fat=Phi(c);
    return cab+`<h2>Efeitos marginais</h2><p>O coeficiente vale para a variável latente. Na escala do escore, o efeito é multiplicado pela probabilidade de não censura.</p>
      <div class="eq">∂E[<i>E</i>] ⁄ ∂INSE = β<sub>1</sub>Φ(<i>c</i>) = ${v(f(b[1],4),.3)} × ${v(f(fat,4),.5)} = ${r(f(b[1]*fat,4),.8)}</div>
      <div class="eq">∂E[<i>E</i>] ⁄ ∂TEMP = γ<sub>1</sub>Φ(<i>c</i>) = ${v(f(b[2],4),1.1)} × ${v(f(fat,4),1.2)} = ${r(f(b[2]*fat,4),1.5)}</div>
      <table class="coef"><thead><tr><th>Variável</th><th>Coef.</th><th>Erro-padrão</th><th>IC 95%</th></tr></thead><tbody>
      ${["Constante","INSE","Docentes temporários","Participação dos anos finais","Ciclo 2021","Ciclo 2023"].map((n,k)=>`<tr><td>${n}</td><td>${f(b[k],4)}</td><td>${f(TOB.se[k],4)}</td><td>${f(b[k]-1.96*TOB.se[k],3)} a ${f(b[k]+1.96*TOB.se[k],3)}</td></tr>`).join("")}
      </tbody></table>
      <p class="nota">Um ponto a mais no INSE está associado a ${f(b[1]*fat*100,2)} centésimos a mais no escore esperado do município. A leitura é de associação e não de efeito causal.</p>`;
  }
  function cena(p){
    const o=lista[i], mu=lat(o), ob=TOB.obs[o.k];
    limparTudo(); montar(); guias();
    const alvo = gPontos.selectAll("circle").filter(e=>e===ob).raise().attr("fill","var(--avaliado)").attr("r",6.5);
    if(p===0){ alvo.attr("cx",x(x.domain()[0])+4); rotulo(x(x.domain()[0])+4,y(o.E),`${o.municipio} E = ${f(o.E,3)}`,"var(--avaliado)",10,-8); return; }
    if(p===1){ alvo.attr("cx",x(x.domain()[0])+4).transition().delay(T(1600)).duration(T(1000)).attr("cx",x(mu));
      gLinhas.append("line").attr("x1",x(mu)).attr("x2",x(mu)).attr("y1",y(y.domain()[0])).attr("y2",y(y.domain()[0])).attr("stroke","var(--avaliado)").attr("stroke-dasharray","3 3")
        .transition().delay(T(2600)).duration(T(600)).attr("y2",y(mu));
      agenda(()=>rotulo(x(mu),y(o.E),`x′β = ${f(mu,3)}`,"var(--avaliado)"), T(2700)); return; }
    rotulo(x(mu),y(o.E),o.municipio,"var(--avaliado)");
    if(p===2){ densidade(mu,true); return; }
    curva(p===3);
    const Ee=esper(mu);
    gExtra.append("rect").attr("x",x(mu)-5).attr("y",y(Ee)-5).attr("width",10).attr("height",10).attr("fill","var(--alvo)").attr("transform",`rotate(45 ${x(mu)} ${y(Ee)})`)
      .attr("opacity",0).transition().delay(p===3?T(1400):0).duration(T(400)).attr("opacity",1);
    gLinhas.append("line").attr("x1",x(mu)).attr("x2",x(mu)).attr("y1",y(o.E)).attr("y2",y(Ee)).attr("stroke","var(--alvo)").attr("stroke-width",1.2).attr("stroke-dasharray","2 3");
    if(p===4){ const dmu=0.05, e2=esper(mu+dmu);
      gLinhas.append("line").attr("x1",x(mu-dmu)).attr("y1",y(Ee-(e2-Ee))).attr("x2",x(mu+dmu)).attr("y2",y(e2)).attr("stroke","var(--avaliado)").attr("stroke-width",2.5);
      rotulo(x(mu+dmu),y(e2),`inclinação Φ(c) = ${f(Phi((1-mu)/s),3)}`,"var(--avaliado)",8,-10); }
  }
  selC.addEventListener("change",()=>{ carregar(); player.inicio(); });
  selMun.addEventListener("change",()=>{ i=+selMun.value; player.inicio(); });
  carregar();
  return { passos, dur, html, cena, montar, proximo(){ i=(i+1)%lista.length; selMun.value=i; }, controle:"ctl-tobit" };
})();

/* =====================================================================
   Módulo Tratamento dos dados
   ===================================================================== */
const trat = (()=>{
  const selC=document.getElementById("ciclo-trat"), selMun=document.getElementById("mun-trat");
  preencher(selC, Object.keys(TRAT).map(c=>[c,c])); selC.value="2015";
  let lista=[], i=0;
  const passos=["Leitura do RREO","Deflação pelo IPCA","Matrículas e ponderação","Gasto por aluno","Insumo do ciclo","Produtos do SAEB","Valores atípicos"];
  const dur=[4600,4600,4400,4600,3800,3800,5600];
  const ETAPAS=["Municípios do interior","Formulário válido nos dois anos","Gasto positivo nos dois anos","Proficiências disponíveis","Sem sinal de conferência"];
  const etapaDoPasso=[1,1,1,2,2,3,4];
  const ok=(rec,k)=>{
    if(k===0) return true;
    if(k===1) return rec.zerado===0;
    if(k===2) return ok(rec,1) && rec.anos.every(a=>a.g>0);
    if(k===3) return ok(rec,2) && rec.mat>0 && rec.port>0;
    return ok(rec,3) && sinais(rec).length===0;
  };
  function mediana(a){ const s=[...a].sort((p,q)=>p-q), m=s.length>>1; return s.length%2 ? s[m] : (s[m-1]+s[m])/2; }
  function estat(c, v){
    const xs=TRAT[c].filter(rr=>rr.entra).map(rr=>rr[v]), med=mediana(xs), mad=mediana(xs.map(t=>Math.abs(t-med)))*1.4826;
    return {med,mad};
  }
  function sinais(rec){
    if(!(rec.mat>0&&rec.port>0)||!rec.entra) return [];
    const c=selC.value, res=[];
    ["mat","port"].forEach(v=>{
      const {med,mad}=estat(c,v), z=(rec[v]-med)/mad;
      const outros=Object.keys(TRAT).filter(k=>k!==c).map(k=>TRAT[k].find(rr=>rr.n===rec.n)).filter(rr=>rr&&rr.entra).map(rr=>rr[v]);
      const mm=outros.length?mediana(outros):null, dv=mm===null?null:rec[v]-mm;
      res.push({v,valor:rec[v],med,mad,z,mm,dv,sinal:Math.abs(z)>3.5||(dv!==null&&Math.abs(dv)>40)});
    });
    return res.filter(s=>s.sinal);
  }
  function todos(rec){
    const c=selC.value, res=[];
    if(!(rec.mat>0&&rec.port>0)) return res;
    ["mat","port"].forEach(v=>{
      const {med,mad}=estat(c,v), z=(rec[v]-med)/mad;
      const outros=Object.keys(TRAT).filter(k=>k!==c).map(k=>TRAT[k].find(rr=>rr.n===rec.n)).filter(rr=>rr&&rr.entra).map(rr=>rr[v]);
      const mm=outros.length?mediana(outros):null;
      res.push({v,valor:rec[v],med,mad,z,mm,dv:mm===null?null:rec[v]-mm});
    });
    return res;
  }
  function carregar(manter){
    const nome=manter&&lista[i]?lista[i].n:null;
    lista=TRAT[selC.value];
    preencher(selMun, lista.map((rr,k)=>[rr.n,k]));
    const a=nome?lista.findIndex(rr=>rr.n===nome):-1; i=a>=0?a:0; selMun.value=i;
  }
  const yE=k=>58+k*86, x0=M.l-20, x1=W-160, xFora=W-36;
  function montar(){
    mostrarEixos(false); d3.select("#faixa").style("display","none");
    gPontos.selectAll("*").remove();
    legenda([["--ponto","Municípios na etapa"],["--avaliado","Município avaliado"],["--alvo","Fora da etapa ou para conferência"]]);
    document.getElementById("rodape").textContent="O tratamento segue as seções 3.3 e 3.4 do projeto. A despesa vem do Anexo 8 do RREO no SIOPE e as matrículas vêm do Censo Escolar. A ponderação usa os fatores urbanos do FUNDEB. A regra de valores atípicos sinaliza o caso para conferência na fonte e não o exclui automaticamente.";
  }
  function funil(ate, anima){
    gFundo.selectAll("*").remove(); gPontos.selectAll("*").remove();
    const rec=lista[i], N=lista.length, passo=(x1-x0)/(N-1);
    ETAPAS.forEach((t,k)=>{
      const dentro=lista.filter(rr=>ok(rr,k));
      gFundo.append("text").attr("class","titulo-eixo").attr("x",x0).attr("y",yE(k)-16).text(`${k+1}. ${t}`);
      gFundo.append("text").attr("class","rotulo").attr("x",x1+12).attr("y",yE(k)+4).attr("fill","var(--tinta-suave)").text(k<=ate?`${dentro.length} de ${N}`:"");
      gFundo.append("line").attr("x1",x0).attr("x2",x1).attr("y1",yE(k)).attr("y2",yE(k)).attr("stroke","var(--linha)");
      if(k>ate) return;
      gPontos.selectAll(null).data(dentro).join("circle").attr("cx",(d,q)=>x0+q*passo*(N-1)/Math.max(1,N-1)).attr("cy",yE(k)).attr("r",3.4)
        .attr("fill",d=>d===rec?"var(--avaliado)":"var(--ponto)").attr("opacity",d=>d===rec?1:.75)
        .attr("cx",(d,q)=>x0+q*passo).attr("r",d=>d===rec?6:3.4);
    });
    gFundo.append("text").attr("class","titulo-eixo").attr("x",xFora).attr("y",yE(0)-16).attr("text-anchor","middle").text("fora");
    gFundo.append("line").attr("x1",xFora).attr("x2",xFora).attr("y1",yE(0)-6).attr("y2",yE(4)+6).attr("stroke","var(--linha)").attr("stroke-dasharray","2 3");
    let ult=0; for(let k=1;k<=ate;k++){ if(ok(rec,k)) ult=k; else break; }
    const falhou = ult<ate;
    const px = falhou ? xFora : x0 + lista.filter(rr=>ok(rr,ult)).indexOf(rec)*passo;
    const py = falhou ? yE(ult+1) : yE(ult);
    const tok=gExtra.append("circle").attr("r",8).attr("fill","none").attr("stroke",falhou?"var(--alvo)":"var(--avaliado)").attr("stroke-width",2.5);
    if(anima && !reduz){ const prevY=yE(Math.max(0,ult-(falhou?0:1))); tok.attr("cx",px).attr("cy",prevY).transition().duration(T(900)).attr("cy",py); }
    else tok.attr("cx",px).attr("cy",py);
    if(falhou){
      gExtra.append("text").attr("class","rotulo").attr("x",xFora).attr("y",py+24).attr("text-anchor","middle").attr("fill","var(--alvo)").text(ult+1===4?"conferir":"excluído");
    }
    agenda(()=>rotulo(px,py,rec.n,falhou?"var(--alvo)":"var(--avaliado)",falhou?-12:4,falhou?-14:24), T(anima?900:0));
  }
  function html(p){
    const rec=lista[i], c=+selC.value, [a0,a1]=rec.anos, anos=[c-1,c];
    const cab=`<p class="municipio">${rec.n} <span class="nota">(janela ${c-1} e ${c} do ciclo ${c})</span></p>`;
    if(p===0){
      const linha=(a,ano,dl)=> a.formulario_zerado ? `<div class="eq">${ano} &nbsp; formulário zerado ${r("sem execução informada",dl)}</div>` :
        `<div class="eq"><i>Desp</i><sup>N</sup><sub>${ano}</sub> = FUNDEB + impostos = ${v(R(a.fundeb_ef_liquidada||0),dl)} + ${v(R(a.impostos_ef_liquidada||0),dl+.2)} = ${r(R(a.mde_ef_liquidada),dl+.5)}</div>`;
      return cab+`<h2>Leitura do RREO</h2><p>A extração busca no Anexo 8 as despesas liquidadas do Ensino Fundamental em MDE. Quando a despesa vem dividida por fonte, as parcelas são somadas após a conferência de que não há sobreposição.</p>
        ${linha(a0,anos[0],.2)}${linha(a1,anos[1],1.1)}
        <p class="nota">Formulários ${a0.desenho_rreo} e ${a1.desenho_rreo}. Conferência dos componentes ${a0.auditoria_componentes_ef_liquidada||"não informada"} e ${a1.auditoria_componentes_ef_liquidada||"não informada"}. ${rec.zerado?"Há formulário zerado na janela, e a observação sai do ciclo.":"A janela tem formulários válidos nos dois anos."}</p>`;
    }
    if(p===1) return cab+`<h2>Deflação pelo IPCA</h2><p>A despesa nominal é levada a preços médios de 2025 pelo IPCA médio anual.</p>
      ${[a0,a1].map((a,k)=>`<div class="eq"><i>Desp</i><sup>R</sup><sub>${anos[k]}</sub> = <i>Desp</i><sup>N</sup> × 100 ⁄ ${v(f(a.ipca,2),.2+k)} = ${v(R(a.mde_ef_liquidada||0),.4+k)} × ${v(f(a.fat,4),.6+k)} = ${r(R(a.real||0),.9+k)}</div>`).join("")}
      <p class="nota">O índice médio de 2025 vale 100. O fator corrige a perda de poder de compra entre o ano da despesa e 2025.</p>`;
    if(p===2) return cab+`<h2>Matrículas e ponderação</h2><p>As matrículas municipais do Ensino Fundamental vêm do Censo Escolar. A versão ponderada converte os anos finais em aluno equivalente dos anos iniciais.</p>
      ${[a0,a1].map((a,k)=>`<div class="eq"><i>Mat</i><sub>${anos[k]}</sub> = ${v(fi(a.ai),.2+k)} + ${v(fi(a.af),.3+k)} = ${r(fi(a.mt),.5+k)}</div>
      <div class="eq"><i>Mat</i><sup>pond</sup><sub>${anos[k]}</sub> = 1,00 × ${v(fi(a.ai),.6+k)} + 1,10 × ${v(fi(a.af),.7+k)} = ${r(f(a.mp,1),.9+k)}</div>`).join("")}
      <p class="nota">Anos finais representam ${f(a1.af/a1.mt*100,1)}% das matrículas em ${c}.</p>`;
    if(p===3) return cab+`<h2>Gasto por aluno</h2><p>A despesa real é dividida pelas matrículas da mesma etapa e do mesmo exercício.</p>
      ${[a0,a1].map((a,k)=>`<div class="eq"><i>G</i><sub>${anos[k]}</sub> = ${v(R(a.real||0),.2+k)} ⁄ ${v(fi(a.mt),.4+k)} = ${r(R(a.g||0),.6+k)}<span class="num">(1)</span></div>
      <div class="eq"><i>G</i><sup>pond</sup><sub>${anos[k]}</sub> = ${v(R(a.real||0),.7+k)} ⁄ ${v(f(a.mp,1),.8+k)} = ${r(R(a.gp||0),.95+k)}</div>`).join("")}
      <p class="nota">${rec.anos.every(a=>a.g>0)?"O gasto é positivo nos dois anos.":"Falta gasto positivo em um dos anos, e a média do ciclo não é calculada."}</p>`;
    if(p===4) return cab+`<h2>Insumo do ciclo</h2><p>A média dos dois anos forma o insumo da DEA.</p>
      <div class="eq"><i>X</i><sub>${c}</sub> = (${v(R(a0.g||0),.2)} + ${v(R(a1.g||0),.4)}) ⁄ 2 = ${r(rec.x?R(rec.x):"não calculado",.7)}<span class="num">(2)</span></div>
      <div class="eq"><i>X</i><sup>pond</sup><sub>${c}</sub> = (${v(R(a0.gp||0),1)} + ${v(R(a1.gp||0),1.2)}) ⁄ 2 = ${r(rec.xp?R(rec.xp):"não calculado",1.5)}</div>`;
    if(p===5) return cab+`<h2>Produtos do SAEB</h2><p>Os produtos são as proficiências do 5º ano da rede municipal no ciclo.</p>
      <div class="eq"><i>Y</i><sub>mat</sub> = ${r(rec.mat?f(rec.mat):"ausente",.3)}&nbsp;&nbsp; <i>Y</i><sub>port</sub> = ${r(rec.port?f(rec.port):"ausente",.6)}</div>
      <p>${rec.entra?"Insumo e produtos estão disponíveis e são positivos. O município entra na DEA do ciclo.":`O município não entra na DEA do ciclo. Motivo registrado ${String(rec.motivo).toLowerCase().replaceAll("_"," ")}.`}</p>
      <p class="nota">A ausência em um ciclo não retira o município dos demais ciclos.</p>`;
    const ss=todos(rec), sn=sinais(rec);
    return cab+`<h2>Valores atípicos</h2><p>Duas regras sinalizam proficiências para conferência. A primeira compara o valor com a mediana do ciclo. A segunda compara o valor com a série do próprio município.</p>
      ${ss.map((s,k)=>`<div class="eq"><i>z</i><sub>${s.v}</sub> = (${v(f(s.valor),.2+k)} − ${v(f(s.med),.3+k)}) ⁄ ${v(f(s.mad),.4+k)} = ${r(f(s.z,2),.6+k)}</div>
        <div class="eq">desvio<sub>${s.v}</sub> = ${v(f(s.valor),.7+k)} − ${v(s.mm===null?"sem série":f(s.mm),.8+k)} = ${r(s.dv===null?"sem série":f(s.dv,1),.95+k)}</div>`).join("") || `<p>Sem proficiências no ciclo.</p>`}
      <p class="nota">Sinal quando |z| passa de 3,5 ou o desvio passa de 40 pontos. O denominador é 1,4826 vezes o desvio absoluto mediano. ${sn.length?`O caso tem ${sn.length===1?"um sinal":"dois sinais"} e deve ser conferido no arquivo do INEP.`:"O caso não tem sinal de conferência."}</p>`;
  }
  function cena(p){
    limparTudo(); montar();
    funil(etapaDoPasso[p], p===0||p===3||p===5||p===6);
  }
  selC.addEventListener("change",()=>{ carregar(true); player.inicio(true); });
  selMun.addEventListener("change",()=>{ i=+selMun.value; player.inicio(); });
  carregar(false);
  return { passos, dur, html, cena, montar, proximo(){ i=(i+1)%lista.length; selMun.value=i; }, controle:"ctl-trat" };
})();

/* =====================================================================
   Reprodutor
   ===================================================================== */
let temporizadores=[];
function agenda(fn, ms){ temporizadores.push(setTimeout(fn, ms)); }
function cancelarAgenda(){ temporizadores.forEach(clearTimeout); temporizadores=[]; }

const player = (()=>{
  let mod=trat, passo=0, tocando=false, timer=null;
  const ol=document.getElementById("passos"), bt=document.getElementById("tocar");
  function lista(){
    ol.innerHTML="";
    mod.passos.forEach((t,k)=>{ const li=document.createElement("li"), b=document.createElement("button");
      b.textContent=`${k+1}. ${t}`; b.addEventListener("click",()=>{ pausar(); ir(k,true); }); li.appendChild(b); ol.appendChild(li); });
  }
  function ir(p, imediato){
    cancelarAgenda(); passo=p;
    ol.querySelectorAll("button").forEach((b,k)=>{ if(k===p) b.setAttribute("aria-current","step"); else b.removeAttribute("aria-current"); });
    document.getElementById("conteudo").innerHTML = mod.html(p);
    mod.cena(p, imediato && p===4);
  }
  function avancar(){
    if(passo<mod.passos.length-1) ir(passo+1); else { mod.proximo(); ir(0); }
    if(tocando) agendar();
  }
  function agendar(){ clearTimeout(timer); timer=setTimeout(avancar, T(mod.dur[passo])); }
  function pausar(){ tocando=false; clearTimeout(timer); bt.textContent="Reproduzir"; }
  bt.addEventListener("click",()=>{ if(tocando) pausar(); else { tocando=true; bt.textContent="Pausar"; agendar(); } });
  document.getElementById("avancar").addEventListener("click",()=>{ pausar(); if(passo<mod.passos.length-1) ir(passo+1); else { mod.proximo(); ir(0); } });
  document.getElementById("voltar").addEventListener("click",()=>{ pausar(); if(passo>0) ir(passo-1,true); });
  document.getElementById("proximo").addEventListener("click",()=>{ mod.proximo(); ir(0); if(tocando) agendar(); });
  const abas={ "aba-trat":trat, "aba-dea":dea, "aba-malm":malm, "aba-tobit":tobit };
  Object.entries(abas).forEach(([id,m])=>document.getElementById(id).addEventListener("click",()=>{
    pausar(); mod=m;
    Object.keys(abas).forEach(k=>document.getElementById(k).setAttribute("aria-selected", k===id ? "true" : "false"));
    ["ctl-trat","ctl-dea","ctl-malm","ctl-tobit"].forEach(c=>document.getElementById(c).hidden = c!==m.controle);
    document.getElementById("proximo").textContent = m===tobit ? "Próximo caso" : "Próximo município";
    limparTudo(); m.montar(); lista(); ir(0,true);
  }));
  return { inicio(remontar){ cancelarAgenda(); if(remontar){ limparTudo(); mod.montar(); } ir(0,true); if(tocando) agendar(); }, iniciar(){ trat.montar(); lista(); ir(0,true); } };
})();
player.iniciar();
</script>
